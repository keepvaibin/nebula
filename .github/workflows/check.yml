name: Check

# Every push and pull request: every platform builds, the unit tests run on Windows and Linux, the Rust tests run, and the
# Direct3D 12, Direct3D 11, Linux (Vulkan) and Mac (Metal) programs start without game data (--start-check). What needs
# a real GPU, the game's data or the tablet runs in the local gate (tools/gate/gate.py), whose results are kept in
# docs/plan/gate-runs.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: '22.1.6'
  ANDROID_NDK: '28.2.13676358'

jobs:
  windows:
    name: Windows (three renderers, unit tests)
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Repository audit (no game content, build outputs, oversized files or credentials)
        shell: pwsh
        run: |
          ./tools/audit_repo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Nebula, NebulaVk, NebulaD11 and the unit tests
        shell: pwsh
        run: |
          . .\tools\enter_msvc_environment.ps1 | Out-Null
          $build = Join-Path $env:RUNNER_TEMP 'host'
          cmake -S . -B $build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEBULA_VULKAN=ON -DNEBULA_D3D11=ON `
            "-DNEBULA_EXTRA_CMAKE=$((Resolve-Path tools/test_driver/test_driver.cmake).Path.Replace('\','/'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unit tests
        shell: pwsh
        run: |
          . .\tools\enter_msvc_environment.ps1 | Out-Null
          ctest --test-dir (Join-Path $env:RUNNER_TEMP 'host') --output-on-failure --timeout 600
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # Each program starts without game data (host_main.cpp run_start_check): its window and renderer on the runner's
      # software adapter, 300 frames drawn and shown. A crash, a renderer that does not start or no picture fails it.
      - name: Start check (Direct3D 12 and Direct3D 11)
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'host'
          foreach ($exe in 'Nebula', 'NebulaD11') {
            $d = Join-Path $env:RUNNER_TEMP "start-$exe"
            New-Item -ItemType Directory -Force "$d/data", "$d/settings" | Out-Null
            $p = Start-Process (Join-Path $build "$exe.exe") -WindowStyle Hidden -PassThru `
              -ArgumentList '--start-check', '300', '--data', "$d/data", '--settings', "$d/settings", '--crash-dumps', $d `
              -RedirectStandardOutput "$d/out.txt" -RedirectStandardError "$d/err.txt"
            $null = $p.Handle
            if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Output "${exe}: no end in 5 minutes"; exit 1 }
            Get-Content "$d/out.txt", "$d/err.txt" | Select-String 'start check|\[gpu\] adapter'
            if ($p.ExitCode -ne 0) { Write-Output "${exe}: exit $($p.ExitCode)"; Get-Content "$d/err.txt" -Tail 30; exit 1 }
          }

  windows-game:
    name: Windows game modules
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: LLVM
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          mkdir llvm
          tar -xJf llvm.tar.xz -C llvm --strip-components=1
          rm llvm.tar.xz
      - name: Both game modules, the headless host and the self-description
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'game'
          $llvm = Join-Path $env:RUNNER_TEMP 'llvm\bin'
          & .\native\build.ps1 -Petari native\petari -Build $build -Llvm $llvm -Target all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The game's unit tests
        shell: pwsh
        run: |
          ctest --test-dir (Join-Path $env:RUNNER_TEMP 'game') --output-on-failure --timeout 600
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        shell: bash
        run: cargo test --release --locked -p nebula-import -p luma-validate

  linux-unit:
    name: Linux unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - name: LLVM
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ninja-build
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
          mkdir llvm
          tar -xJf llvm.tar.xz -C llvm --strip-components=1
          rm llvm.tar.xz
      # The same list as Windows (cmake/unit_tests.cmake), with the Linux build's clang and lld.
      - name: Unit tests
        env:
          NEBULA_LLVM: ${{ runner.temp }}/llvm
        run: |
          cmake -S tests/unit -B "$RUNNER_TEMP/unit" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_TOOLCHAIN_FILE=$PWD/platform/linux/llvm-toolchain.cmake"
          cmake --build "$RUNNER_TEMP/unit" -- -k 0
          ctest --test-dir "$RUNNER_TEMP/unit" --output-on-failure --timeout 600
      - name: The game's unit tests
        env:
          NEBULA_LLVM: ${{ runner.temp }}/llvm
        run: |
          cmake -S native -B "$RUNNER_TEMP/game" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_TOOLCHAIN_FILE=$PWD/platform/linux/llvm-toolchain.cmake"
          cmake --build "$RUNNER_TEMP/game" --target native_tests
          ctest --test-dir "$RUNNER_TEMP/game" --output-on-failure --timeout 600

  linux:
    name: Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - name: Build tools and SDL's system libraries
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: LLVM
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
          mkdir llvm
          tar -xJf llvm.tar.xz -C llvm --strip-components=1
          rm llvm.tar.xz
      - name: Dependencies
        run: sh tools/fetch_build_deps.sh "$RUNNER_TEMP/deps"
      - name: Build Nebula
        run: sh platform/linux/build_linux.sh -d "$RUNNER_TEMP/deps" -l "$RUNNER_TEMP/llvm" -w "$RUNNER_TEMP/work"
      - name: Start check (Vulkan on Mesa's software renderer, on a virtual display)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mesa-vulkan-drivers xvfb xauth
          d="$RUNNER_TEMP/start"
          mkdir -p "$d/data" "$d/settings"
          SDL_AUDIO_DRIVER=dummy timeout 300 xvfb-run -a "$RUNNER_TEMP/work/bin/nebula" --start-check 300 \
            --data "$d/data" --settings "$d/settings" --crash-dumps "$d"

  macos:
    name: Mac
    runs-on: macos-15
    timeout-minutes: 300
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v7
      - name: Build tools
        run: |
          echo "TOOLS=$HOME/nebula-tools" >> "$GITHUB_ENV"
          echo "WORK=$HOME/nebula-work" >> "$GITHUB_ENV"
          brew install llvm ninja
          llvm="$(brew --prefix llvm)"
          echo "BREW_LLVM_VERSION=$("$llvm/bin/llvm-config" --version)" >> "$GITHUB_ENV"
          mkdir -p "$HOME/nebula-tools/toolchain"
          ln -sfn "$llvm" "$HOME/nebula-tools/toolchain/llvm"
          rustup target add aarch64-apple-darwin
      - name: Restore libc++
        id: libcxx-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/nebula-tools/toolchain/libcxx
          key: libcxx-macos-arm64-${{ env.BREW_LLVM_VERSION }}-${{ hashFiles('platform/apple/build_libcxx.sh') }}
      - name: Build libc++
        if: steps.libcxx-cache.outputs.cache-hit != 'true'
        run: |
          src="$RUNNER_TEMP/llvm-src"
          mkdir -p "$src"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm-project.tar.xz" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$BREW_LLVM_VERSION/llvm-project-$BREW_LLVM_VERSION.src.tar.xz"
          tar -xJf "$RUNNER_TEMP/llvm-project.tar.xz" -C "$src" --strip-components 1
          sh platform/apple/build_libcxx.sh "$src" "$TOOLS/toolchain/llvm" "$TOOLS/toolchain/libcxx" macos arm64
          rm -rf "$TOOLS/toolchain/libcxx/build-macos-arm64"
      - name: Save libc++
        if: steps.libcxx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/nebula-tools/toolchain/libcxx
          key: ${{ steps.libcxx-cache.outputs.cache-primary-key }}
      - name: Dependencies
        run: sh tools/fetch_build_deps.sh "$TOOLS/deps" apple
      - name: Build Nebula.app
        run: |
          mkdir -p "$RUNNER_TEMP/shipped"
          cp installer/lumakit/lumakit.luma "$RUNNER_TEMP/shipped/"
          sh platform/apple/build_macos.sh -t "$TOOLS" -w "$WORK" -a arm64 -m "$RUNNER_TEMP/shipped"
      - name: Start check (Metal)
        timeout-minutes: 5
        run: |
          d="$RUNNER_TEMP/start"
          mkdir -p "$d/data" "$d/settings"
          "$WORK/Nebula.app/Contents/MacOS/Nebula" --start-check 300 --data "$d/data" --settings "$d/settings" \
            --crash-dumps "$d"

  android:
    name: Android
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Android NDK
        shell: pwsh
        run: |
          'y' | & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --install "ndk;$env:ANDROID_NDK" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: LLVM (the row generator's libclang)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          mkdir llvm
          tar -xJf llvm.tar.xz -C llvm --strip-components=1
          rm llvm.tar.xz
          echo "LLVM_ROOT=$(cygpath -m "$RUNNER_TEMP/llvm")" >> "$GITHUB_ENV"
      - name: Dependencies
        shell: bash
        run: sh tools/fetch_build_deps.sh "$RUNNER_TEMP/deps" android
      - name: Shader tools
        shell: pwsh
        run: |
          . .\tools\enter_msvc_environment.ps1 | Out-Null
          $build = Join-Path $env:RUNNER_TEMP 'tools'
          cmake -S . -B $build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEBULA_VULKAN=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --target galaxy_native_spirv galaxy_utility_spirv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = Join-Path $env:RUNNER_TEMP 'host-tools'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item (Join-Path $build 'galaxy_native_spirv.exe'), (Join-Path $build 'galaxy_utility_spirv.exe') $out
      - name: Build the app
        shell: pwsh
        run: |
          $temp = $env:RUNNER_TEMP
          $shipped = Join-Path $temp 'shipped'
          New-Item -ItemType Directory -Force $shipped | Out-Null
          Copy-Item installer\lumakit\lumakit.luma $shipped
          .\platform\android\build_apk.ps1 -Deps (Join-Path $temp 'deps') -Work (Join-Path $temp 'apk') `
            -HostTools (Join-Path $temp 'host-tools') -ShippedMods $shipped -Unsigned -ReleaseKey ''
