name: Check

# A push to main or to a candidate (gate/*, pushed by gate.py land), a pull request, and a start by hand: every platform builds,
# the unit tests run on Windows and Linux, the Rust tests run, and the Direct3D 12, Direct3D 11, Linux (Vulkan), Mac (Metal) and
# Android (Vulkan, on an x86_64 emulator) programs start without game data (--start-check). A push to a work branch starts
# nothing: the landing's candidate is the one run of a commit that is read. What needs
# a real GPU, the game's data or the tablet runs in the local gate (tools/gate/gate.py), whose results are kept in
# docs/plan/gate-runs. The compiler caches (.github/actions/compiler-cache) are restored by every run and saved by main only.
# AMD's FSR 3 is in the Windows, Linux and Android programs: those jobs set NEBULA_REQUIRE_FSR3, so a build that leaves it out stops
# (cmake/fidelityfx_vk_shaders.cmake). Its shader compiler runs on Windows only: the ffx-shaders job makes the headers and the Linux
# job takes them (.github/actions/ffx-vk-shaders).
on:
  push:
    branches: [main, 'gate/**']
  pull_request:
  # The Windows and Android jobs (the nightly class of tools/gate/github_jobs.tsv) run on main and when started by hand.
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same ref cancels the old run, except for main and a candidate (gate/*), which keep their results.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/heads/gate/') }}

env:
  LLVM_VERSION: '22.1.6'
  ANDROID_NDK: '28.2.13676358'

jobs:
  # FidelityFX's Vulkan shader headers, for the Linux job (the SDK's shader compiler runs on Windows only). Every run, a candidate too.
  ffx-shaders:
    name: FSR 3 shaders (Windows)
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/ffx-vk-shaders
        with:
          folder: ${{ runner.temp }}/ffx-vk-shaders
      - uses: actions/upload-artifact@v7
        with:
          name: ffx-vk-shaders
          path: ${{ runner.temp }}/ffx-vk-shaders
          if-no-files-found: error
          retention-days: 1

  windows:
    name: Windows (three renderers, unit tests)
    # Main and a start by hand, not a candidate (file 04, 8): this machine builds and tests Windows and Android itself, and a
    # landing reads only the jobs of the class must.
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      NEBULA_REQUIRE_FSR3: 'ON'
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: ./.github/actions/compiler-cache
        with:
          name: windows
          size: 1024M
      - name: Repository audit (no game content, build outputs, oversized files or credentials)
        shell: pwsh
        run: |
          ./tools/audit_repo.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Nebula, NebulaVk, NebulaD11 and the unit tests
        shell: pwsh
        run: |
          . .\tools\enter_msvc_environment.ps1 | Out-Null
          $build = Join-Path $env:RUNNER_TEMP 'host'
          cmake -S . -B $build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEBULA_VULKAN=ON -DNEBULA_D3D11=ON `
            "-DNEBULA_EXTRA_CMAKE=$((Resolve-Path tools/test_driver/test_driver.cmake).Path.Replace('\','/'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Unit tests
        shell: pwsh
        run: |
          . .\tools\enter_msvc_environment.ps1 | Out-Null
          ctest --test-dir (Join-Path $env:RUNNER_TEMP 'host') --output-on-failure --timeout 600
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The compiler cache's hits and misses
        if: always() && steps.cache.outputs.key != ''
        shell: bash
        run: sccache --show-stats
      - name: Save the compiler cache
        if: always() && steps.cache.outputs.key != '' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ steps.cache.outputs.key }}
      # Each program starts without game data: its window and renderer on the runner's software adapter, 300 frames
      # drawn and shown (the action: Mesa's lavapipe and the Vulkan loader for NebulaVk).
      - name: Start check (Direct3D 12, Vulkan and Direct3D 11)
        uses: ./.github/actions/start-check-windows
        with:
          folder: ${{ runner.temp }}\host

  windows-game:
    name: Windows game modules
    # Main and a start by hand, not a candidate (file 04, 8): this machine builds and tests Windows and Android itself, and a
    # landing reads only the jobs of the class must.
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: ./.github/actions/compiler-cache
        with:
          name: windows-game
          size: 640M
      - name: LLVM
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          mkdir llvm
          tar -xJf llvm.tar.xz -C llvm --strip-components=1
          rm llvm.tar.xz
      - name: Both game modules, the headless host and the self-description
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'game'
          $llvm = Join-Path $env:RUNNER_TEMP 'llvm\bin'
          & .\native\build.ps1 -Petari native\petari -Build $build -Llvm $llvm -Target all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The compiler cache's hits and misses
        if: always() && steps.cache.outputs.key != ''
        shell: bash
        run: sccache --show-stats
      - name: Save the compiler cache
        if: always() && steps.cache.outputs.key != '' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ steps.cache.outputs.key }}
      - name: The game's unit tests
        shell: pwsh
        run: |
          ctest --test-dir (Join-Path $env:RUNNER_TEMP 'game') --output-on-failure --timeout 600
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows too on main, candidates and a start by hand; work branches run Rust on Linux only (file 04, 8).
        os: ${{ fromJSON((github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/gate/') || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04", "windows-2022"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        shell: bash
        run: cargo test --release --locked -p nebula-import -p luma-validate

  linux-unit:
    name: Linux unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: ./.github/actions/compiler-cache
        with:
          name: linux-unit
          size: 512M
      # The code checks gate.py runs as repo/code (P-043): the console census, cast_check and byte_order_check.
      - name: Code checks
        run: |
          for check in console_census cast_check byte_order_check; do
            python3 -X utf8 -I "tools/verify/$check.py" . || exit 1
          done
      - name: LLVM
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ninja-build
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
          mkdir llvm
          tar -xJf llvm.tar.xz -C llvm --strip-components=1
          rm llvm.tar.xz
      # The same list as Windows (cmake/unit_tests.cmake), with the Linux build's clang and lld.
      - name: Unit tests
        env:
          NEBULA_LLVM: ${{ runner.temp }}/llvm
        run: |
          cmake -S tests/unit -B "$RUNNER_TEMP/unit" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_TOOLCHAIN_FILE=$PWD/platform/linux/llvm-toolchain.cmake"
          cmake --build "$RUNNER_TEMP/unit" -- -k 0
          ctest --test-dir "$RUNNER_TEMP/unit" --output-on-failure --timeout 600
      - name: The game's unit tests
        env:
          NEBULA_LLVM: ${{ runner.temp }}/llvm
        run: |
          cmake -S native -B "$RUNNER_TEMP/game" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_TOOLCHAIN_FILE=$PWD/platform/linux/llvm-toolchain.cmake"
          cmake --build "$RUNNER_TEMP/game" --target native_tests
          ctest --test-dir "$RUNNER_TEMP/game" --output-on-failure --timeout 600

      - name: The compiler cache's hits and misses
        if: always() && steps.cache.outputs.key != ''
        shell: bash
        run: sccache --show-stats
      - name: Save the compiler cache
        if: always() && steps.cache.outputs.key != '' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ steps.cache.outputs.key }}
  # The unit tests under the address and undefined-behaviour sanitizers, and under the thread sanitizer (file 00
  # section 4.2); the game's own tests under both (its arenas poison what is free under the first, NebulaArena.cpp; the
  # second sees the game's hand-offs between threads, P-012 and P-183). A finding ends the test that made it (no
  # recovery), so ctest fails. The tour under the sanitizers runs in the local gate.
  linux-sanitizers:
    name: Linux sanitizers (${{ matrix.sanitize }})
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        sanitize: ['address,undefined', 'thread']
    env:
      NEBULA_LLVM: ${{ github.workspace }}/../llvm
      ASAN_OPTIONS: detect_leaks=1:abort_on_error=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: ./.github/actions/compiler-cache
        with:
          # A cache key holds no comma: 'address,undefined' is named address-undefined (N-1045).
          name: sanitizers-${{ matrix.sanitize == 'thread' && 'thread' || 'address-undefined' }}
          size: 512M
      - name: LLVM
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ninja-build
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm.tar.xz" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
          mkdir -p "$NEBULA_LLVM"
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$NEBULA_LLVM" --strip-components=1
          rm "$RUNNER_TEMP/llvm.tar.xz"
      - name: Unit tests
        run: |
          s='${{ matrix.sanitize }}'
          flags="-fsanitize=$s -fno-omit-frame-pointer -fno-sanitize-recover=all -g"
          cmake -S tests/unit -B "$RUNNER_TEMP/unit" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_TOOLCHAIN_FILE=$PWD/platform/linux/llvm-toolchain.cmake" \
            "-DCMAKE_C_FLAGS=$flags" "-DCMAKE_CXX_FLAGS=$flags" \
            "-DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld -fsanitize=$s" "-DCMAKE_SHARED_LINKER_FLAGS=-fuse-ld=lld -fsanitize=$s" \
            "-DCMAKE_MODULE_LINKER_FLAGS=-fuse-ld=lld -fsanitize=$s"
          cmake --build "$RUNNER_TEMP/unit" -- -k 0
          ctest --test-dir "$RUNNER_TEMP/unit" --output-on-failure --timeout 1200
      - name: The game's unit tests
        run: |
          cmake -S native -B "$RUNNER_TEMP/game" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            "-DCMAKE_TOOLCHAIN_FILE=$PWD/platform/linux/llvm-toolchain.cmake" '-DNEBULA_SANITIZE=${{ matrix.sanitize }}'
          cmake --build "$RUNNER_TEMP/game" --target native_tests
          ctest --test-dir "$RUNNER_TEMP/game" --output-on-failure --timeout 1200

      - name: The compiler cache's hits and misses
        if: always() && steps.cache.outputs.key != ''
        shell: bash
        run: sccache --show-stats
      - name: Save the compiler cache
        if: always() && steps.cache.outputs.key != '' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ steps.cache.outputs.key }}
  linux:
    name: Linux
    needs: ffx-shaders
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NEBULA_REQUIRE_FSR3: 'ON'
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: ./.github/actions/compiler-cache
        with:
          name: linux
          size: 1536M
      - name: Build tools and SDL's system libraries
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: LLVM
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
          mkdir llvm
          tar -xJf llvm.tar.xz -C llvm --strip-components=1
          rm llvm.tar.xz
      - name: Dependencies
        run: sh tools/fetch_build_deps.sh "$RUNNER_TEMP/deps"
      # FSR 3's shader headers, made by the ffx-shaders job (its compiler runs on Windows only).
      - uses: actions/download-artifact@v8
        with:
          name: ffx-vk-shaders
          path: ${{ runner.temp }}/ffx-vk-shaders
      - name: Build Nebula
        # NEBULA_REQUIRE_FSR3 is read by the script and by CMake: without the shader headers the build stops.
        run: sh platform/linux/build_linux.sh -d "$RUNNER_TEMP/deps" -l "$RUNNER_TEMP/llvm" -w "$RUNNER_TEMP/work" -s "$RUNNER_TEMP/ffx-vk-shaders"
      - name: FSR 3 (the program holds it)
        run: python3 -X utf8 -I tools/check_fsr3_package.py "$RUNNER_TEMP/work/bin/nebula"
      - name: The compiler cache's hits and misses
        if: always() && steps.cache.outputs.key != ''
        shell: bash
        run: sccache --show-stats
      - name: Save the compiler cache
        if: always() && steps.cache.outputs.key != '' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ steps.cache.outputs.key }}
      - name: Start check (Vulkan on Mesa's software renderer, on a virtual display, with the validation layer)
        shell: bash
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-validationlayers xvfb xauth openbox
          d="$RUNNER_TEMP/start"
          mkdir -p "$d/data" "$d/settings"
          # The Khronos layer checks every Vulkan call of the start (instance, device, swap chain, present) against the rules:
          # an error it prints ([VK-LIVE-ERR]) fails the step. A screen of 1920 x 1080 with a window manager (openbox).
          SDL_AUDIO_DRIVER=dummy timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" sh -c 'openbox >/dev/null 2>&1 & sleep 2; exec "$0" "$@"' \
            "$RUNNER_TEMP/work/bin/nebula" --start-check 300 --gpu-validation 1 \
            --data "$d/data" --settings "$d/settings" --crash-dumps "$d" 2>&1 | tee "$d/start.log"
          grep -c 'VK-LIVE-WARN' "$d/start.log" || true
          if grep -q 'VK-LIVE-ERR' "$d/start.log"; then grep 'VK-LIVE-ERR' "$d/start.log" | sort | uniq -c | head -n 20; exit 1; fi
          # The default setting is borderless full screen, and a window manager is there to carry it out: the window must say it is
          # full screen at the screen's size (1920 x 1080), and the system's pointer must be hidden while it has the focus.
          for line in 'borderless full screen 1920 x 1080 pixels' "the system's pointer is hidden"; do
            grep -q "$line" "$d/start.log" || { echo "the start log has no line '$line':"; grep -e '^\[window\]' -e '^\[display\]' "$d/start.log" || true; exit 1; }
          done
      - name: Start check with FSR 3 chosen (the settings file asks for it; the log says it was made, or what the device lacks)
        shell: bash
        run: |
          d="$RUNNER_TEMP/start-fsr3"
          mkdir -p "$d/data" "$d/settings"
          printf 'upscaler=fsr3\n' > "$d/settings/config.ini"
          status=0
          SDL_AUDIO_DRIVER=dummy timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" sh -c 'openbox >/dev/null 2>&1 & sleep 2; exec "$0" "$@"' \
            "$RUNNER_TEMP/work/bin/nebula" --start-check 600 --gpu-validation 1 \
            --data "$d/data" --settings "$d/settings" --crash-dumps "$d" 2>&1 | tee "$d/start.log" || status=$?
          # Exit 4 is "no picture shown": with an upscaler chosen the start check's cleared pictures are not counted as shown (SGSR 2 does the same).
          [ "$status" = 0 ] || [ "$status" = 4 ] || { echo "the start check ended with $status"; exit 1; }
          if grep -q 'VK-LIVE-ERR' "$d/start.log"; then grep 'VK-LIVE-ERR' "$d/start.log" | sort | uniq -c | head -n 20; exit 1; fi
          grep -e '^\[fsr3\]' -e 'FSR 3' "$d/start.log" || true
          python3 -X utf8 -I tools/check_fsr3_start_log.py "$d/start.log"
      - name: Start check on Wayland (weston's headless compositor, a scale of 2)
        shell: bash
        run: |
          # SDL takes Wayland, as it does in a Wayland session. weston's headless output of --width=1920 --height=1080 --scale=2 is
          # 1920 x 1080 points and 3840 x 2160 pixels (the first run of this step read that from the compositor's own mode): the
          # display's desktop mode is 1920 x 1080 points at a density of 2, and the borderless window must come out at the display's
          # 3840 x 2160 pixels, not at the points.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends weston
          d="$RUNNER_TEMP/start-wayland"
          mkdir -p "$d/data" "$d/settings" "$d/run"
          chmod 700 "$d/run"
          export XDG_RUNTIME_DIR="$d/run"
          weston --backend=headless --width=1920 --height=1080 --scale=2 --socket=nebula-wayland --idle-time=0 > "$d/weston.log" 2>&1 &
          weston_pid=$!
          for _ in $(seq 1 50); do [ -S "$XDG_RUNTIME_DIR/nebula-wayland" ] && break; sleep 0.2; done
          [ -S "$XDG_RUNTIME_DIR/nebula-wayland" ] || { echo "weston did not start:"; cat "$d/weston.log"; exit 1; }
          status=0
          WAYLAND_DISPLAY=nebula-wayland SDL_VIDEODRIVER=wayland SDL_AUDIO_DRIVER=dummy timeout 300 "$RUNNER_TEMP/work/bin/nebula" --start-check 300 \
            --gpu-validation 1 --data "$d/data" --settings "$d/settings" --crash-dumps "$d" 2>&1 | tee "$d/start.log" || status=$?
          kill "$weston_pid" 2>/dev/null || true
          echo "weston said:"; head -n 40 "$d/weston.log"
          [ "$status" = 0 ] || { echo "the start check ended with $status"; exit 1; }
          if grep -q 'VK-LIVE-ERR' "$d/start.log"; then grep 'VK-LIVE-ERR' "$d/start.log" | sort | uniq -c | head -n 20; exit 1; fi
          for line in 'SDL video driver wayland' 'headless: 3840 x 2160 pixels' 'borderless full screen 3840 x 2160 pixels'; do
            grep -q "$line" "$d/start.log" || { echo "the start log has no line '$line':"; grep -e '^\[window\]' -e '^\[display\]' "$d/start.log" || true; exit 1; }
          done

  macos:
    name: Mac
    runs-on: macos-15
    timeout-minutes: 300
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: ./.github/actions/compiler-cache
        with:
          name: macos
          size: 1536M
      - name: Build tools
        run: |
          echo "TOOLS=$HOME/nebula-tools" >> "$GITHUB_ENV"
          echo "WORK=$HOME/nebula-work" >> "$GITHUB_ENV"
          brew install ninja
          llvm="$HOME/nebula-tools/toolchain/llvm"
          mkdir -p "$llvm"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm.tar.xz" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-macOS-ARM64.tar.xz"
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$llvm" --strip-components=1
          rm "$RUNNER_TEMP/llvm.tar.xz"
          test "$("$llvm/bin/llvm-config" --version)" = "$LLVM_VERSION"
          # The row generator's libclang (native/CMakeLists.txt: a cross build looks under LLVM_ROOT).
          echo "LLVM_ROOT=$llvm" >> "$GITHUB_ENV"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Restore libc++
        id: libcxx-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/nebula-tools/toolchain/libcxx
          key: libcxx-macos-universal-${{ env.LLVM_VERSION }}-${{ hashFiles('platform/apple/build_libcxx.sh') }}
      - name: Build libc++
        if: steps.libcxx-cache.outputs.cache-hit != 'true'
        run: |
          src="$RUNNER_TEMP/llvm-src"
          mkdir -p "$src"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm-project.tar.xz" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/llvm-project-$LLVM_VERSION.src.tar.xz"
          tar -xJf "$RUNNER_TEMP/llvm-project.tar.xz" -C "$src" --strip-components 1
          # One for each processor of the universal app (Intel and Apple silicon).
          for arch in arm64 x86_64; do
            sh platform/apple/build_libcxx.sh "$src" "$TOOLS/toolchain/llvm" "$TOOLS/toolchain/libcxx" macos "$arch"
            rm -rf "$TOOLS/toolchain/libcxx/build-macos-$arch"
          done
      - name: Save libc++
        if: steps.libcxx-cache.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/nebula-tools/toolchain/libcxx
          key: ${{ steps.libcxx-cache.outputs.cache-primary-key }}
      - name: Dependencies
        run: sh tools/fetch_build_deps.sh "$TOOLS/deps" apple
      - name: Build Nebula.app
        run: |
          mkdir -p "$RUNNER_TEMP/shipped"
          cp installer/lumakit/lumakit.luma "$RUNNER_TEMP/shipped/"
          sh platform/apple/build_macos.sh -t "$TOOLS" -w "$WORK" -a "x86_64 arm64" -m "$RUNNER_TEMP/shipped"
      - name: The compiler cache's hits and misses
        if: always() && steps.cache.outputs.key != ''
        shell: bash
        run: sccache --show-stats
      - name: Save the compiler cache
        if: always() && steps.cache.outputs.key != '' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ steps.cache.outputs.key }}
      # The renderer's own shaders come from the app's utility.metallib (P-065): its start takes every one from there and
      # compiles none from its text (utility_library_mtl.mm logs each such compile and the count).
      - name: Start check (Metal)
        timeout-minutes: 5
        run: |
          set -o pipefail
          d="$RUNNER_TEMP/start"
          mkdir -p "$d/data" "$d/settings"
          "$WORK/Nebula.app/Contents/MacOS/Nebula" --start-check 300 --data "$d/data" --settings "$d/settings" \
            --crash-dumps "$d" 2>&1 | tee "$d/start.log"
          grep -E '^\[metal\] renderer shaders: [1-9][0-9]* from utility\.metallib, 0 compiled from their text, 0 failed' "$d/start.log" \
            || { echo "the start took a renderer shader from elsewhere than utility.metallib:"; grep -e '^\[metal\]' "$d/start.log"; exit 1; }
          if grep -q 'renderer shader compiled from its text' "$d/start.log"; then
            grep 'renderer shader compiled from its text' "$d/start.log"; exit 1
          fi
          # P-034: after the frames the display clock is held for a second (no vsyncs while held, some once let go:
          # exit 6 otherwise); the line says what was counted, or that this machine's display gives no vsyncs.
          grep -E '^start check: display clock: ' "$d/start.log" \
            || { echo "the start check did not look at the display clock's hold"; exit 1; }
      # The program finds its game module and the system loads it (the start check above does not load it), and the app's files
      # name no library outside the system and the app (release.yml has the same checks on the packed zip).
      - name: Module check and the app's files
        timeout-minutes: 5
        run: |
          sh platform/apple/check_module.sh "$WORK/Nebula.app" "$RUNNER_TEMP/module-check"
          python3 -X utf8 -I tools/check_macos_app.py "$WORK/Nebula.app" --mods

  android:
    name: Android (${{ matrix.abi }})
    # Main and a start by hand, not a candidate (file 04, 8): this machine builds and tests Windows and Android itself, and a
    # landing reads only the jobs of the class must.
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      NEBULA_REQUIRE_FSR3: 'ON'
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v7
      - id: cache
        uses: ./.github/actions/compiler-cache
        with:
          name: android-${{ matrix.abi }}
          size: 2560M
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Android NDK
        shell: pwsh
        run: |
          'y' | & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --install "ndk;$env:ANDROID_NDK" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: LLVM (the row generator's libclang)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          mkdir llvm
          tar -xJf llvm.tar.xz -C llvm --strip-components=1
          rm llvm.tar.xz
          echo "LLVM_ROOT=$(cygpath -m "$RUNNER_TEMP/llvm")" >> "$GITHUB_ENV"
      - name: Dependencies
        shell: bash
        run: sh tools/fetch_build_deps.sh "$RUNNER_TEMP/deps" android
      - name: Shader tools
        shell: pwsh
        run: |
          . .\tools\enter_msvc_environment.ps1 | Out-Null
          $build = Join-Path $env:RUNNER_TEMP 'tools'
          cmake -S . -B $build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEBULA_VULKAN=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --target galaxy_native_spirv galaxy_utility_spirv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $out = Join-Path $env:RUNNER_TEMP 'host-tools'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item (Join-Path $build 'galaxy_native_spirv.exe'), (Join-Path $build 'galaxy_utility_spirv.exe') $out
      - name: Build the app
        shell: pwsh
        run: |
          $temp = $env:RUNNER_TEMP
          $shipped = Join-Path $temp 'shipped'
          New-Item -ItemType Directory -Force $shipped | Out-Null
          Copy-Item installer\lumakit\lumakit.luma $shipped
          .\platform\android\build_apk.ps1 -Deps (Join-Path $temp 'deps') -Work (Join-Path $temp 'apk') `
            -HostTools (Join-Path $temp 'host-tools') -ShippedMods $shipped -Unsigned -ReleaseKey '' -UnitTests `
            -Abis '${{ matrix.abi }}'
      # The test app (dev.nebula.galaxy.test, debuggable, with the test runner's Harness.java) for the start check,
      # x86_64 only: the same build folder, so the native code built above is not built again.
      - name: FSR 3 (the app's program holds it)
        shell: bash
        run: python -X utf8 -I tools/check_fsr3_package.py "$RUNNER_TEMP/apk/Nebula-unsigned.apk"
      - name: Build the test app (x86_64)
        if: matrix.abi == 'x86_64'
        shell: pwsh
        run: |
          $temp = $env:RUNNER_TEMP
          .\platform\android\build_apk.ps1 -Deps (Join-Path $temp 'deps') -Work (Join-Path $temp 'apk') `
            -HostTools (Join-Path $temp 'host-tools') -Abis x86_64 -Debuggable `
            -Harness (Join-Path $PWD 'tools/test_driver/android/java') `
            -ReleaseKey ''
      - name: The compiler cache's hits and misses
        if: always() && steps.cache.outputs.key != ''
        shell: bash
        run: sccache --show-stats
      - name: Save the compiler cache
        if: always() && steps.cache.outputs.key != '' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/sccache
          key: ${{ steps.cache.outputs.key }}
      - uses: actions/upload-artifact@v7
        if: matrix.abi == 'x86_64'
        with:
          name: android-test-app
          path: ${{ runner.temp }}/apk/Nebula.apk
          retention-days: 1

  android-start:
    name: Android start check (x86_64 emulator)
    needs: android
    # Needs an Android build, so it runs where those do.
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SYSTEM_IMAGE: system-images;android-34;google_apis;x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: android-test-app
          path: ${{ runner.temp }}/app
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The emulator and its system image
        run: |
          # Where avdmanager writes the device and the emulator reads it, for this step and the later ones: without it
          # they did not agree ("Unknown AVD name"). An absolute folder, made before avdmanager runs (the runner context
          # cannot be read in a job's env).
          export ANDROID_AVD_HOME="$RUNNER_TEMP/avd"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install emulator platform-tools "$SYSTEM_IMAGE" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force -n start -k "$SYSTEM_IMAGE"
          if ! "$ANDROID_HOME/emulator/emulator" -list-avds | grep -qx start; then
            echo "the device was not made where the emulator reads it"
            ls -la "$ANDROID_AVD_HOME" "$HOME/.android/avd" 2>&1
            exit 1
          fi
      - name: Start the emulator
        run: |
          nohup "$ANDROID_HOME/emulator/emulator" -avd start -no-window -no-audio -no-boot-anim -no-snapshot \
            -gpu swiftshader_indirect -camera-back none -camera-front none > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator=$!
          adb="$ANDROID_HOME/platform-tools/adb"
          "$adb" start-server
          # Started when the system says so; stopped at once when the emulator itself ends.
          for i in $(seq 1 120); do
            if ! kill -0 "$emulator" 2>/dev/null; then
              echo "the emulator ended before the system started"
              tail -50 "$RUNNER_TEMP/emulator.log"
              exit 1
            fi
            [ "$("$adb" -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && exit 0
            sleep 5
          done
          echo "the emulator did not finish starting in 10 minutes"
          tail -50 "$RUNNER_TEMP/emulator.log"
          exit 1
      - name: Start check (Vulkan)
        run: |
          python3 -X utf8 -I tools/lumacore/luma_test_android.py start-check --device emulator-5554 \
            --apk "$RUNNER_TEMP/app/Nebula.apk" --frames 300 --limit 300
      - name: The emulator's log
        if: failure()
        run: tail -100 "$RUNNER_TEMP/emulator.log"
