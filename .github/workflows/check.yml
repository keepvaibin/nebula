name: Check

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  LLVM_VERSION: '22.1.6'

jobs:
  probe:
    name: Probe
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: LLVM
        run: |
          brew install ninja
          llvm="$HOME/llvm"; mkdir -p "$llvm"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-macOS-ARM64.tar.xz"
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$llvm" --strip-components=1
          rt=$(find "$llvm/lib/clang" -name 'libclang_rt.osx.a'); echo "llvm runtime: $rt"; lipo -archs "$rt"
          ls "$(dirname "$rt")" | head -30
          xrt=$(find "$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/clang" -name 'libclang_rt.osx.a'); echo "xcode runtime: $xrt"; lipo -archs "$xrt"
          cat > "$RUNNER_TEMP/t.c" <<'EOC'
          #include <stdio.h>
          int main(void) {
              int a = 0;
              if (__builtin_available(macOS 13.0, *)) a += 1;
              __builtin_cpu_init();
              if (__builtin_cpu_supports("avx2")) a += 2;
              printf("%d\n", a);
              return 0;
          }
          EOC
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          echo "== default link (expect failure)"
          "$llvm/bin/clang" --target=x86_64-apple-macosx12.0 -isysroot "$sdk" -arch x86_64 "$RUNNER_TEMP/t.c" -o "$RUNNER_TEMP/t0" 2>&1 | tail -8 || true
          echo "== E1: Xcode's runtime thinned to x86_64, linked by name"
          lipo "$xrt" -thin x86_64 -output "$RUNNER_TEMP/rt_x86_64.a"
          "$llvm/bin/clang" --target=x86_64-apple-macosx12.0 -isysroot "$sdk" -arch x86_64 "$RUNNER_TEMP/t.c" "$RUNNER_TEMP/rt_x86_64.a" -o "$RUNNER_TEMP/t1" && echo "E1 links" && file "$RUNNER_TEMP/t1" && (arch -x86_64 /usr/bin/true && "$RUNNER_TEMP/t1" || echo "no rosetta run")
          echo "== E2: builtins from the LLVM source"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/src.tar.xz" "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/llvm-project-$LLVM_VERSION.src.tar.xz"
          mkdir -p "$RUNNER_TEMP/src"; tar -xJf "$RUNNER_TEMP/src.tar.xz" -C "$RUNNER_TEMP/src" --strip-components 1
          cmake -G Ninja -S "$RUNNER_TEMP/src/runtimes" -B "$RUNNER_TEMP/rtb" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/rtout" \
            -DCMAKE_C_COMPILER="$llvm/bin/clang" -DCMAKE_CXX_COMPILER="$llvm/bin/clang++" -DCMAKE_AR="$llvm/bin/llvm-ar" -DCMAKE_RANLIB="$llvm/bin/llvm-ranlib" \
            -DCMAKE_SYSTEM_NAME=Darwin -DCMAKE_OSX_SYSROOT="$sdk" -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_C_COMPILER_TARGET=x86_64-apple-macosx12.0 -DCMAKE_CXX_COMPILER_TARGET=x86_64-apple-macosx12.0 -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DLLVM_ENABLE_RUNTIMES=compiler-rt -DCOMPILER_RT_BUILD_BUILTINS=ON -DCOMPILER_RT_BUILD_SANITIZERS=OFF -DCOMPILER_RT_BUILD_XRAY=OFF \
            -DCOMPILER_RT_BUILD_LIBFUZZER=OFF -DCOMPILER_RT_BUILD_PROFILE=OFF -DCOMPILER_RT_BUILD_MEMPROF=OFF -DCOMPILER_RT_BUILD_ORC=OFF \
            -DCOMPILER_RT_BUILD_CTX_PROFILE=OFF -DCOMPILER_RT_ENABLE_IOS=OFF -DCOMPILER_RT_DEFAULT_TARGET_ONLY=ON -DLLVM_INCLUDE_TESTS=OFF -DCOMPILER_RT_INCLUDE_TESTS=OFF
          cmake --build "$RUNNER_TEMP/rtb" --target install
          find "$RUNNER_TEMP/rtout" -name '*.a' | head; 
          a=$(find "$RUNNER_TEMP/rtout" -name '*.a' | head -n 1); lipo -archs "$a"
          "$llvm/bin/clang" --target=x86_64-apple-macosx12.0 -isysroot "$sdk" -arch x86_64 "$RUNNER_TEMP/t.c" "$a" -o "$RUNNER_TEMP/t2" && echo "E2 links" && (arch -x86_64 /usr/bin/true && "$RUNNER_TEMP/t2" || echo "no rosetta run")
