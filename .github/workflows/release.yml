name: Release

# Pushing a tag v<version> (or running this workflow with one) makes the draft release "Nebula <version>" and builds
# every package into it: the Windows Setup (installer/build-native-setup.ps1), the Linux package
# (platform/linux/build_linux.sh, installer/package-linux.sh), the Mac app (platform/apple/build_macos.sh) and the
# Android app (platform/android/build_apk.ps1). Nothing built here is signed: the keys stay on the release PC, where
# installer/sign-release.ps1 signs the Android app and adds the signatures the updates check. The release is
# published from there, by hand.
# Run by hand with "dry run", it builds every package from the chosen branch and keeps them as the run's artifacts:
# no tag, no release. Its "version" says which release it builds as (v2.0.0-beta.1's: 2.0.0-beta.1); without it the
# version is CMakeLists.txt's.
# A pre-release (a version with "-": 2.0.0-beta.1) is built with no mod support (CMake NEBULA_MODS=OFF, set for every
# build below by the environment variable of that name): only the plain game module, no LumaKit (the lumakit job is
# skipped), no mod entry in any package. The version's label (-beta.1) goes to every build the same way
# (NEBULA_VERSION_SUFFIX, cmake/nebula_options.cmake). tools/release_workflow_test.py runs both rules.
# A release is built only from a commit main holds whose Check run (check.yml) passed: the first job asks GitHub
# (tools/release_guard.py) and every package job needs it; a dry run only reports the answer. Each package job ends
# with the start check check.yml runs, on the package as built (P-023).
# AMD's FSR 3 is in the Windows, Linux and Android packages: those jobs set NEBULA_REQUIRE_FSR3, so a build that leaves it out stops
# (cmake/fidelityfx_vk_shaders.cmake). Its shader compiler runs on Windows only: the ffx-shaders job makes the headers and the Linux
# job takes them (.github/actions/ffx-vk-shaders). Each package is checked to hold it (tools/check_fsr3_package.py).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag (v2.1.0); not needed for a dry run
        required: false
      dry_run:
        description: Build the packages only (no release)
        type: boolean
        default: false
      version:
        description: A dry run's version (2.0.0-beta.1; empty is CMakeLists.txt's)
        required: false

permissions:
  contents: write
  # The guard reads the commit's Check runs.
  actions: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  LLVM_VERSION: '22.1.6'
  DXC_RELEASE: v1.9.2609
  DXC_ARCHIVE: dxc_2026_09_29.zip
  ANDROID_NDK: '28.2.13676358'

jobs:
  release:
    name: Release
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.what.outputs.publish }}
      tag: ${{ steps.what.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prefix: ${{ steps.version.outputs.prefix }}
      suffix: ${{ steps.version.outputs.suffix }}
      mods: ${{ steps.version.outputs.mods }}
      ref: ${{ steps.what.outputs.ref }}
    steps:
      - name: What this run builds
        id: what
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # A release: a pushed tag, or a run by hand with a tag and without "dry run". Anything else builds only.
          tag=
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            tag=$GITHUB_REF_NAME
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$DRY_RUN" != true ]; then
            tag=$INPUT_TAG
            [ -n "$tag" ] || { echo "a release needs its tag (or choose dry run)"; exit 1; }
          fi
          if [ -n "$tag" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "ref=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.what.outputs.ref }}
      - name: On main, its Check run green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ steps.what.outputs.publish }}
        run: |
          only=--report-only
          [ "$PUBLISH" = true ] && only=
          python3 -X utf8 -I tools/release_guard.py --repo "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)" $only
      - name: Version and notes
        id: version
        shell: bash
        env:
          TAG: ${{ steps.what.outputs.tag }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          project=$(sed -n 's/^project(Nebula VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          version=${TAG#v}
          [ -n "$TAG" ] || version=${INPUT_VERSION#v}
          [ -n "$version" ] || version=$project
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' ||
            { echo "$TAG: a release tag is v<major>.<minor>.<patch> or v<major>.<minor>.<patch>-beta.<n>"; exit 1; }
          [ "${version%%-*}" = "$project" ] || { echo "$TAG is not the version in CMakeLists.txt ($project)"; exit 1; }
          # A pre-release has no mod support (and no LumaKit); a release has both.
          case $version in *-beta.*) prefix=Nebula-Beta; mods=OFF; suffix=-${version#*-} ;; *) prefix=Nebula; mods=ON; suffix= ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prefix=$prefix" >> "$GITHUB_OUTPUT"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          echo "mods=$mods" >> "$GITHUB_OUTPUT"
          # Each release's notes are written beforehand in .github/release-notes/<version>.md: no notes, no release (a dry run
          # that names its version is held to it too: it proves the notes are there).
          if [ -n "$TAG" ] || [ -n "$INPUT_VERSION" ]; then
            [ -s ".github/release-notes/$version.md" ] ||
              { echo ".github/release-notes/$version.md is missing: write the release notes before tagging"; exit 1; }
          fi
          echo "Building $prefix $version from $(git rev-parse HEAD)${TAG:+ for $TAG} (mod support $mods)"
      - name: The draft release
        if: steps.what.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.what.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && exit 0
          prerelease=
          case $VERSION in *-*) prerelease=--prerelease ;; esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "Nebula $VERSION" \
            $prerelease --notes-file ".github/release-notes/$VERSION.md"

  ffx-shaders:
    name: FSR 3 shaders (Windows)
    needs: release
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.ref }}
      - uses: ./.github/actions/ffx-vk-shaders
        with:
          folder: ${{ runner.temp }}/ffx-vk-shaders
      - uses: actions/upload-artifact@v7
        with:
          name: ffx-vk-shaders
          path: ${{ runner.temp }}/ffx-vk-shaders
          if-no-files-found: error

  windows-hosts:
    name: Windows programs (${{ matrix.level }})
    needs: release
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      NEBULA_MODS: ${{ needs.release.outputs.mods }}
      NEBULA_VERSION_SUFFIX: ${{ needs.release.outputs.suffix }}
      NEBULA_REQUIRE_FSR3: 'ON'
    strategy:
      fail-fast: false
      matrix:
        include:
          - level: avx2
            baseline: 'OFF'
          - level: x86-64-v2
            baseline: 'ON'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.ref }}
      - name: Diagnostics address
        shell: bash
        env:
          NEBULA_DIAG_ENDPOINT: ${{ vars.NEBULA_DIAG_ENDPOINT }}
          NEBULA_DIAG_PUBLIC_KEY: ${{ vars.NEBULA_DIAG_PUBLIC_KEY }}
        run: bash tools/diag_endpoint_local.sh
      - name: Build Nebula, NebulaVk and NebulaD11
        shell: pwsh
        run: |
          . .\tools\enter_msvc_environment.ps1 | Out-Null
          $build = Join-Path $env:RUNNER_TEMP 'host'
          cmake -S . -B $build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNEBULA_VULKAN=ON -DNEBULA_D3D11=ON `
            "-DNEBULA_HOST_BASELINE=${{ matrix.baseline }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build $build --target Nebula NebulaVk NebulaD11 nebula_glslang
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # What the Setup and the Android build take: the programs, the Agility SDK's runtime, glslang's compiler and
          # the shader tools.
          $out = Join-Path $env:RUNNER_TEMP 'out'
          New-Item -ItemType Directory -Force $out | Out-Null
          Get-ChildItem -LiteralPath $build -Filter 'Nebula*.exe' | Copy-Item -Destination $out
          Copy-Item -Recurse -LiteralPath (Join-Path $build 'D3D12') -Destination (Join-Path $out 'D3D12')
          New-Item -ItemType Directory -Force (Join-Path $out 'glslang'), (Join-Path $out 'host-tools') | Out-Null
          Copy-Item (Join-Path $build 'glslang-tool\glslang.exe'), (Join-Path $build 'glslang-tool\LICENSE.txt') (Join-Path $out 'glslang')
          Copy-Item (Join-Path $build 'galaxy_native_spirv.exe'), (Join-Path $build 'galaxy_utility_spirv.exe') (Join-Path $out 'host-tools')
          Get-ChildItem -Recurse -File $out | ForEach-Object { '{0,12:N0}  {1}' -f $_.Length, $_.FullName.Substring($out.Length + 1) }
      - uses: actions/upload-artifact@v7
        with:
          name: windows-hosts-${{ matrix.level }}
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  windows-game:
    name: Windows game module
    needs: release
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      NEBULA_MODS: ${{ needs.release.outputs.mods }}
      NEBULA_VERSION_SUFFIX: ${{ needs.release.outputs.suffix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.ref }}
      - name: LLVM
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          mkdir llvm
          tar -xJf llvm.tar.xz -C llvm --strip-components=1
          rm llvm.tar.xz
          llvm/bin/clang --version
      - name: Build the game module
        shell: pwsh
        run: |
          $build = Join-Path $env:RUNNER_TEMP 'game'
          $llvm = Join-Path $env:RUNNER_TEMP 'llvm\bin'
          # The players' build: ThinLTO with the profile in native/pgo. Both modules, the self-description and the
          # services list, for both CPU levels.
          # The build's log: tools/gate/pgo.py check reads how much of the profile is out of date (P-014).
          $log = Join-Path $env:RUNNER_TEMP 'game-build.log'
          # No mod support (NEBULA_MODS=OFF): the plain module only, no rows, no self-description.
          $targets = 'smg_game', 'smg_game_plain', 'luma_self_description', 'luma_services_file'
          if ($env:NEBULA_MODS -eq 'OFF') { $targets = @('smg_game_plain') }
          foreach ($target in $targets) {
            & .\native\build.ps1 -Petari native\petari -Build $build -Pgo -Llvm $llvm -Target $target *>&1 |
              Tee-Object -Append -FilePath $log
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -X utf8 -I tools/gate/pgo.py check $log
          if ($LASTEXITCODE -ne 0) {
            # A pre-release (a version with a label) is built with the profile it has: the check says how stale it is and the
            # build goes on (no promise on speed, a beta). A release stops here: its profile is made again first.
            if ($env:NEBULA_VERSION_SUFFIX) { Write-Host "the profile is out of date: told, not judged, for a pre-release"; $global:LASTEXITCODE = 0 }
            else { exit $LASTEXITCODE }
          }
          $out = Join-Path $env:RUNNER_TEMP 'out'
          $names = Join-Path $out 'names'
          New-Item -ItemType Directory -Force (Join-Path $out 'bin\x86-64-v2'), (Join-Path $names 'luma_types') | Out-Null
          Copy-Item (Join-Path $build 'smg_game_plain.dll') (Join-Path $out 'bin')
          Copy-Item (Join-Path $build 'x86-64-v2\smg_game_plain.dll') (Join-Path $out 'bin\x86-64-v2')
          if ($env:NEBULA_MODS -ne 'OFF') {
            Copy-Item (Join-Path $build 'smg_game.dll') (Join-Path $out 'bin')
            Copy-Item (Join-Path $build 'x86-64-v2\smg_game.dll') (Join-Path $out 'bin\x86-64-v2')
            # The game build folder's self-description, as build-native-setup.ps1 -Names and LumaLink's --names read it.
            Copy-Item -Recurse -LiteralPath (Join-Path $build 'luma') -Destination (Join-Path $names 'luma')
            foreach ($file in 'luma_types.json', 'luma_functions.json', 'luma_numbers.json', 'luma_services.json') {
              Copy-Item (Join-Path $build "luma_types\$file") (Join-Path $names 'luma_types')
            }
            Copy-Item (Join-Path $build 'smg_game.luma-placement.json'), (Join-Path $build 'smg_game.luma-self.json') $names
            # names/ holds some 15,000 small files: as one tar, the artifact downloads as one file (download-artifact
            # unpacks while it downloads, and that many files stall it on Windows until it gives up).
            Push-Location $out
            tar -cf names.tar names
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Pop-Location
          }
          Remove-Item -Recurse -Force $names
      - uses: actions/upload-artifact@v7
        with:
          name: windows-game
          path: ${{ runner.temp }}/out
          if-no-files-found: error

  lumakit:
    name: LumaKit check
    needs: [release, windows-game]
    # LumaKit is a mod: a release with no mod support (a pre-release) has no use for it, and nothing needs its result.
    if: ${{ needs.release.outputs.mods == 'ON' }}
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.ref }}
      - name: LumaLink at the version installer/lumakit names
        shell: bash
        run: |
          # Byte for byte (no CRLF on Windows): the kit's sources are packed as they are, and the check compares them.
          git clone -c core.autocrlf=false --filter=blob:none https://github.com/keepvaibin/lumalink.git "$RUNNER_TEMP/lumalink"
          git -C "$RUNNER_TEMP/lumalink" checkout "$(tr -d '\r\n' < installer/lumakit/lumalink-version.txt)"
          # LumaLink builds with the Nebula commit it names (its crates use Nebula's importer).
          git clone -c core.autocrlf=false --filter=blob:none https://github.com/keepvaibin/nebula.git "$RUNNER_TEMP/lumalink/nebula"
          git -C "$RUNNER_TEMP/lumalink/nebula" checkout "$(tr -d '\r\n' < "$RUNNER_TEMP/lumalink/nebula.commit")"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build LumaLink
        shell: bash
        run: |
          cd "$RUNNER_TEMP/lumalink"
          cargo build --release --locked -p lumalink
      - name: LLVM
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          mkdir llvm
          tar -xJf llvm.tar.xz -C llvm --strip-components=1
          rm llvm.tar.xz
      - uses: actions/download-artifact@v8
        with:
          name: windows-game
          path: ${{ runner.temp }}/game
      - name: installer/lumakit/lumakit.luma is LumaLink's LumaKit, as built for this game
        shell: bash
        run: |
          (cd "$RUNNER_TEMP/game" && tar -xf names.tar && rm names.tar)
          # The self-description as an installed game has it (luma/): the function rows and the files beside them.
          self="$RUNNER_TEMP/self"
          mkdir -p "$self"
          cp -R "$RUNNER_TEMP/game/names/luma/." "$self/"
          cp "$RUNNER_TEMP"/game/names/luma_types/*.json "$RUNNER_TEMP"/game/names/*.json "$self/"
          LUMALINK_CLANG="$RUNNER_TEMP/llvm/bin/clang.exe" python tools/build_lumakit.py \
            --lumalink "$RUNNER_TEMP/lumalink/target/release/lumalink.exe" --kit "$RUNNER_TEMP/lumalink/lumakit" \
            --names "$self" --verify installer/lumakit/lumakit.luma

  windows-setup:
    name: Windows Setup
    needs: [release, windows-hosts, windows-game, lumakit]
    # The LumaKit job is skipped for a release with no mod support: its skipping is no failure.
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.windows-hosts.result == 'success' && needs.windows-game.result == 'success' && (needs.lumakit.result == 'success' || needs.lumakit.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      NEBULA_MODS: ${{ needs.release.outputs.mods }}
      NEBULA_VERSION_SUFFIX: ${{ needs.release.outputs.suffix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: windows-hosts-avx2
          path: ${{ runner.temp }}/avx2
      - uses: actions/download-artifact@v8
        with:
          name: windows-hosts-x86-64-v2
          path: ${{ runner.temp }}/v2
      - uses: actions/download-artifact@v8
        with:
          name: windows-game
          path: ${{ runner.temp }}/game
      - name: DirectX Shader Compiler
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o dxc.zip \
            "https://github.com/microsoft/DirectXShaderCompiler/releases/download/$DXC_RELEASE/$DXC_ARCHIVE"
          # The archive's paths use backslashes, which unzip warns about (exit 1); .NET's reader takes them as folders.
          pwsh -NoProfile -Command 'Expand-Archive -LiteralPath dxc.zip -DestinationPath dxc'
      - name: Build the Setup
        shell: pwsh
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          $temp = $env:RUNNER_TEMP
          $noMods = $env:NEBULA_MODS -eq 'OFF'
          if (-not $noMods) {
            Push-Location (Join-Path $temp 'game')
            tar -xf names.tar
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Pop-Location
          }
          $bin = Join-Path $temp 'bin'
          New-Item -ItemType Directory -Force $bin | Out-Null
          # The AVX2 programs with D3D12\ and glslang\, the x86-64-v2 programs beside them, the game modules.
          Copy-Item -Recurse -Path (Join-Path $temp 'avx2\*') -Destination $bin -Exclude 'host-tools'
          Copy-Item (Join-Path $temp 'v2\*-x86-64-v2.exe') $bin
          Copy-Item -Recurse -Path (Join-Path $temp 'game\bin\*') -Destination $bin -Force
          if ($noMods) {
            # No mod support: no self-description, no LumaKit, no game module with the mod rows (the script reads NEBULA_MODS).
            .\installer\build-native-setup.ps1 -Version $env:VERSION -Bin $bin -NoMods `
              -Dxc (Join-Path $temp 'dxc') -OutputDirectory (Join-Path $temp 'dist') -SigningKey ''
          } else {
            $shipped = Join-Path $temp 'shipped'
            New-Item -ItemType Directory -Force $shipped | Out-Null
            Copy-Item installer\lumakit\lumakit.luma $shipped
            .\installer\build-native-setup.ps1 -Version $env:VERSION -Bin $bin -Names (Join-Path $temp 'game\names') `
              -Dxc (Join-Path $temp 'dxc') -ShippedMods $shipped -OutputDirectory (Join-Path $temp 'dist') -SigningKey ''
          }
      # The programs the Setup packed, from the folder it packed them from (the Setup is built: the Vulkan loader the
      # check puts there is not in it), AVX2 and x86-64-v2, on all three renderers.
      - name: Start check (the packed programs)
        uses: ./.github/actions/start-check-windows
        with:
          folder: ${{ runner.temp }}\bin
          programs: Nebula NebulaVk NebulaD11 Nebula-x86-64-v2 NebulaVk-x86-64-v2 NebulaD11-x86-64-v2
      - name: FSR 3 (the programs the Setup packed hold it)
        shell: bash
        run: python -X utf8 -I tools/check_fsr3_package.py "$RUNNER_TEMP/bin/Nebula.exe" "$RUNNER_TEMP/bin/NebulaVk.exe" "$RUNNER_TEMP/bin/Nebula-x86-64-v2.exe" "$RUNNER_TEMP/bin/NebulaVk-x86-64-v2.exe"
      - name: The mod kit (a pre-release has none, a release has it)
        shell: bash
        run: |
          mode=--mods
          [ "$NEBULA_MODS" = OFF ] && mode=--no-mods
          for package in "$RUNNER_TEMP"/dist/*Setup.exe; do
            python -X utf8 -I tools/check_mod_support_package.py "$package" $mode
          done
      - name: Keep it (dry run)
        if: needs.release.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: windows-setup
          path: ${{ runner.temp }}/dist/*Setup.exe
          if-no-files-found: error
      - name: Add it to the release
        if: needs.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/dist/*Setup.exe --repo "$GITHUB_REPOSITORY" --clobber

  linux:
    name: Linux package
    needs: [release, lumakit, ffx-shaders]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.ffx-shaders.result == 'success' && (needs.lumakit.result == 'success' || needs.lumakit.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      NEBULA_MODS: ${{ needs.release.outputs.mods }}
      NEBULA_VERSION_SUFFIX: ${{ needs.release.outputs.suffix }}
      NEBULA_REQUIRE_FSR3: 'ON'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.ref }}
      - name: Diagnostics address
        shell: bash
        env:
          NEBULA_DIAG_ENDPOINT: ${{ vars.NEBULA_DIAG_ENDPOINT }}
          NEBULA_DIAG_PUBLIC_KEY: ${{ vars.NEBULA_DIAG_PUBLIC_KEY }}
        run: bash tools/diag_endpoint_local.sh
      - name: Build tools and SDL's system libraries
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libdecor-0-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev libdrm-dev libgbm-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: LLVM
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-Linux-X64.tar.xz"
          mkdir llvm
          tar -xJf llvm.tar.xz -C llvm --strip-components=1
          rm llvm.tar.xz
          llvm/bin/clang --version
      - name: Dependencies
        run: sh tools/fetch_build_deps.sh "$RUNNER_TEMP/deps"
      # FSR 3's shader headers, made by the ffx-shaders job (its compiler runs on Windows only).
      - uses: actions/download-artifact@v8
        with:
          name: ffx-vk-shaders
          path: ${{ runner.temp }}/ffx-vk-shaders
      - name: Build Nebula
        # NEBULA_MODS=OFF (no mod support) is read by the script and by every CMake project; NEBULA_REQUIRE_FSR3 by the script and
        # by CMake: without the shader headers the build stops.
        run: sh platform/linux/build_linux.sh -d "$RUNNER_TEMP/deps" -l "$RUNNER_TEMP/llvm" -w "$RUNNER_TEMP/work" -s "$RUNNER_TEMP/ffx-vk-shaders"
      - name: Pack it
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          # No mod support (NEBULA_MODS=OFF, which the script reads): no LumaKit.
          shipped=
          if [ "$NEBULA_MODS" != OFF ]; then
            mkdir -p "$RUNNER_TEMP/shipped"
            cp installer/lumakit/lumakit.luma "$RUNNER_TEMP/shipped/"
            shipped="--shipped $RUNNER_TEMP/shipped"
          fi
          # shellcheck disable=SC2086
          sh installer/package-linux.sh --bin "$RUNNER_TEMP/work/bin" --version "$VERSION" $shipped --output "$RUNNER_TEMP/dist"
          for package in "$RUNNER_TEMP"/dist/*.tar.gz; do
            python3 tools/release_manifest.py "$package" "$VERSION"
          done
      - name: FSR 3 (the package's program holds it)
        run: python3 -X utf8 -I tools/check_fsr3_package.py "$RUNNER_TEMP"/dist/*.tar.gz
      - name: Start check (the package as unpacked, Vulkan on Mesa's software renderer, on a virtual display, with the validation layer)
        shell: bash
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mesa-vulkan-drivers vulkan-validationlayers xvfb xauth openbox
          d="$RUNNER_TEMP/start"
          mkdir -p "$d/data" "$d/settings" "$d/unpacked"
          for package in "$RUNNER_TEMP"/dist/*.tar.gz; do tar -C "$d/unpacked" -xzf "$package"; done
          nebula=$(find "$d/unpacked" -path '*/files/nebula' -type f | head -n 1)
          [ -n "$nebula" ] || { echo "the package has no files/nebula"; exit 1; }
          # What a person sees first in the unpacked folder is the installer: install.sh and README.txt (whose first line says what
          # to start) and the two folders; the start script is in support/, which install.sh copies to the install folder.
          top=$(dirname "$(dirname "$nebula")")
          listing=$(LC_ALL=C ls -A "$top" | tr '\n' ' ')
          [ "$listing" = "README.txt files install.sh support " ] || { echo "the package's top folder holds: $listing"; exit 1; }
          head -n 1 "$top/README.txt" | grep -q 'install.sh' || { echo "the first line of README.txt does not say what to start"; exit 1; }
          [ -f "$top/support/nebula-launch" ] && [ -f "$top/support/VERSION" ] || { echo "support/ lacks nebula-launch or VERSION"; exit 1; }
          # A screen of 1920 x 1080 with a window manager (openbox).
          SDL_AUDIO_DRIVER=dummy timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" sh -c 'openbox >/dev/null 2>&1 & sleep 2; exec "$0" "$@"' \
            "$nebula" --start-check 300 --gpu-validation 1 \
            --data "$d/data" --settings "$d/settings" --crash-dumps "$d" 2>&1 | tee "$d/start.log"
          grep -c 'VK-LIVE-WARN' "$d/start.log" || true
          if grep -q 'VK-LIVE-ERR' "$d/start.log"; then grep 'VK-LIVE-ERR' "$d/start.log" | sort | uniq -c | head -n 20; exit 1; fi
          # The default setting is borderless full screen, and a window manager is there to carry it out: the window must say it is
          # full screen at the screen's size (1920 x 1080), and the system's pointer must be hidden while it has the focus.
          for line in 'borderless full screen 1920 x 1080 pixels' "the system's pointer is hidden"; do
            grep -q "$line" "$d/start.log" || { echo "the start log has no line '$line':"; grep -e '^\[window\]' -e '^\[display\]' "$d/start.log" || true; exit 1; }
          done
          # What the package needs of the player's system: the newest glibc and libstdc++ versions any of its files asks for (the
          # notes name them), file by file in the log.
          folder=$(dirname "$nebula")
          all_glibc=; all_glibcxx=
          for file in "$folder"/*; do
            [ -f "$file" ] || continue
            g=$(objdump -T "$file" 2>/dev/null | grep -o 'GLIBC_[0-9.]*' | sort -V | tail -n 1) || true
            x=$(objdump -T "$file" 2>/dev/null | grep -o 'GLIBCXX_[0-9.]*' | sort -V | tail -n 1) || true
            [ -z "$g$x" ] || printf '%s: %s %s\n' "$(basename "$file")" "$g" "$x"
            all_glibc="$all_glibc $g"; all_glibcxx="$all_glibcxx $x"
          done
          glibc=$(printf '%s\n' $all_glibc | sort -V | tail -n 1)
          glibcxx=$(printf '%s\n' $all_glibcxx | sort -V | tail -n 1)
          echo "the package needs $glibc and ${glibcxx:-no GLIBCXX}"
          {
            echo "### The Linux package needs"
            echo "glibc ${glibc#GLIBC_}, libstdc++ ${glibcxx:-none} (objdump -T of every file of the package)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Start check with FSR 3 chosen (the package as unpacked; the settings file asks for FSR 3, the log says it was made or what the device lacks)
        shell: bash
        run: |
          d="$RUNNER_TEMP/start-fsr3"
          mkdir -p "$d/data" "$d/settings"
          nebula=$(find "$RUNNER_TEMP/start/unpacked" -path '*/files/nebula' -type f | head -n 1)
          [ -n "$nebula" ] || { echo "the package has no files/nebula"; exit 1; }
          printf 'upscaler=fsr3\n' > "$d/settings/config.ini"
          status=0
          SDL_AUDIO_DRIVER=dummy timeout 300 xvfb-run -a -s "-screen 0 1920x1080x24" sh -c 'openbox >/dev/null 2>&1 & sleep 2; exec "$0" "$@"' \
            "$nebula" --start-check 600 --gpu-validation 1 \
            --data "$d/data" --settings "$d/settings" --crash-dumps "$d" 2>&1 | tee "$d/start.log" || status=$?
          # Exit 4 is "no picture shown": with an upscaler chosen the start check's cleared pictures are not counted as shown (SGSR 2 does the same).
          [ "$status" = 0 ] || [ "$status" = 4 ] || { echo "the start check ended with $status"; exit 1; }
          if grep -q 'VK-LIVE-ERR' "$d/start.log"; then grep 'VK-LIVE-ERR' "$d/start.log" | sort | uniq -c | head -n 20; exit 1; fi
          grep -e '^\[fsr3\]' -e 'FSR 3' "$d/start.log" || true
          python3 -X utf8 -I tools/check_fsr3_start_log.py "$d/start.log"
      - name: The mod kit (a pre-release has none, a release has it)
        shell: bash
        run: |
          mode=--mods
          [ "$NEBULA_MODS" = OFF ] && mode=--no-mods
          for package in "$RUNNER_TEMP"/dist/*.tar.gz; do
            python3 -X utf8 -I tools/check_mod_support_package.py "$package" $mode
          done
      - name: Keep it (dry run)
        if: needs.release.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
      - name: Add it to the release
        if: needs.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/dist/* --repo "$GITHUB_REPOSITORY" --clobber

  macos:
    name: Mac app
    needs: [release, lumakit]
    if: ${{ !cancelled() && needs.release.result == 'success' && (needs.lumakit.result == 'success' || needs.lumakit.result == 'skipped') }}
    runs-on: macos-15
    timeout-minutes: 300
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      NEBULA_MODS: ${{ needs.release.outputs.mods }}
      NEBULA_VERSION_SUFFIX: ${{ needs.release.outputs.suffix }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.ref }}
      - name: Diagnostics address
        shell: bash
        env:
          NEBULA_DIAG_ENDPOINT: ${{ vars.NEBULA_DIAG_ENDPOINT }}
          NEBULA_DIAG_PUBLIC_KEY: ${{ vars.NEBULA_DIAG_PUBLIC_KEY }}
        run: bash tools/diag_endpoint_local.sh
      - name: Build tools
        run: |
          echo "TOOLS=$HOME/nebula-tools" >> "$GITHUB_ENV"
          echo "WORK=$HOME/nebula-work" >> "$GITHUB_ENV"
          brew install ninja
          # The compiler check.yml pins (LLVM_VERSION), not Homebrew's newest: the tag builds with the path every landing builds.
          llvm="$HOME/nebula-tools/toolchain/llvm"
          mkdir -p "$llvm"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm.tar.xz" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/LLVM-$LLVM_VERSION-macOS-ARM64.tar.xz"
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$llvm" --strip-components=1
          rm "$RUNNER_TEMP/llvm.tar.xz"
          test "$("$llvm/bin/llvm-config" --version)" = "$LLVM_VERSION"
          # The row generator's libclang (native/CMakeLists.txt: a cross build looks under LLVM_ROOT).
          echo "LLVM_ROOT=$llvm" >> "$GITHUB_ENV"
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Restore libc++
        id: libcxx-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/nebula-tools/toolchain/libcxx
          key: libcxx-macos-universal-${{ env.LLVM_VERSION }}-${{ hashFiles('platform/apple/build_libcxx.sh') }}
      - name: Build libc++
        if: steps.libcxx-cache.outputs.cache-hit != 'true'
        run: |
          src="$RUNNER_TEMP/llvm-src"
          mkdir -p "$src"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm-project.tar.xz" \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/llvm-project-$LLVM_VERSION.src.tar.xz"
          tar -xJf "$RUNNER_TEMP/llvm-project.tar.xz" -C "$src" --strip-components 1
          # One for each processor of the universal app (Intel and Apple silicon).
          for arch in arm64 x86_64; do
            sh platform/apple/build_libcxx.sh "$src" "$TOOLS/toolchain/llvm" "$TOOLS/toolchain/libcxx" macos "$arch"
            rm -rf "$TOOLS/toolchain/libcxx/build-macos-$arch"
          done
      - name: Save libc++
        if: steps.libcxx-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/nebula-tools/toolchain/libcxx
          key: ${{ steps.libcxx-cache.outputs.cache-primary-key }}
      - name: Dependencies
        run: sh tools/fetch_build_deps.sh "$TOOLS/deps" apple
      - name: Build Nebula.app
        run: |
          # No mod support (NEBULA_MODS=OFF, which the script reads): no LumaKit.
          shipped=
          if [ "$NEBULA_MODS" != OFF ]; then
            mkdir -p "$RUNNER_TEMP/shipped"
            cp installer/lumakit/lumakit.luma "$RUNNER_TEMP/shipped/"
            shipped="-m $RUNNER_TEMP/shipped"
          fi
          # shellcheck disable=SC2086
          sh platform/apple/build_macos.sh -t "$TOOLS" -w "$WORK" -a "x86_64 arm64" $shipped
      - name: Name it and write its manifest
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PREFIX: ${{ needs.release.outputs.prefix }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          # The name the Mac app's update looks for (update_install_macos.mm): Nebula-Beta-macOS.zip for a beta.
          cp "$WORK/Nebula-macOS.zip" "$RUNNER_TEMP/dist/$PREFIX-macOS.zip"
          python3 tools/release_manifest.py "$RUNNER_TEMP/dist/$PREFIX-macOS.zip" "$VERSION"
      # No library outside the system and the app in any half (it is there on GitHub's Mac, with Xcode, and not on a player's),
      # the minimum macOS, the signature and its entitlements: tools/check_macos_app.py reads the zip's files.
      - name: The app's files (no library outside the system and the app, both processors, the signature)
        env:
          PREFIX: ${{ needs.release.outputs.prefix }}
        run: |
          mode=--mods
          [ "$NEBULA_MODS" = OFF ] && mode=--no-mods
          python3 -X utf8 -I tools/check_macos_app.py "$RUNNER_TEMP/dist/$PREFIX-macOS.zip" $mode
      - name: Start check (the app as unpacked, Metal)
        timeout-minutes: 5
        env:
          PREFIX: ${{ needs.release.outputs.prefix }}
        run: |
          d="$RUNNER_TEMP/start"
          mkdir -p "$d/data" "$d/settings" "$d/unpacked"
          ditto -x -k "$RUNNER_TEMP/dist/$PREFIX-macOS.zip" "$d/unpacked"
          app=$(find "$d/unpacked" -maxdepth 3 -name Nebula.app -type d | head -n 1)
          [ -n "$app" ] || { echo "the zip has no Nebula.app"; exit 1; }
          "$app/Contents/MacOS/Nebula" --start-check 300 --data "$d/data" --settings "$d/settings" --crash-dumps "$d"
      # The program finds its game module and the system loads it, as at a start (the start check above does not load it): the
      # beta's app looked for its plain module in Contents/MacOS and passed every check but a player's start. The same script
      # shows the check refusing a module that is not there and a file that is no module.
      - name: Module check (the app as unpacked)
        timeout-minutes: 5
        run: |
          app=$(find "$RUNNER_TEMP/start/unpacked" -maxdepth 3 -name Nebula.app -type d | head -n 1)
          sh platform/apple/check_module.sh "$app" "$RUNNER_TEMP/module-check"
      # The app's Intel half, as far as this Apple silicon machine can start it (Rosetta). Told, not judged: no Intel Mac is
      # among the runners, and Metal under Rosetta in a virtual machine may not start at all.
      - name: Start check (the Intel half, through Rosetta; told, not judged)
        continue-on-error: true
        timeout-minutes: 8
        env:
          PREFIX: ${{ needs.release.outputs.prefix }}
        run: |
          arch -x86_64 /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license || true
          arch -x86_64 /usr/bin/true || { echo "Rosetta is not here: the Intel half is not started"; exit 1; }
          d="$RUNNER_TEMP/start-intel"
          mkdir -p "$d/data" "$d/settings" "$d/unpacked"
          ditto -x -k "$RUNNER_TEMP/dist/$PREFIX-macOS.zip" "$d/unpacked"
          app=$(find "$d/unpacked" -maxdepth 3 -name Nebula.app -type d | head -n 1)
          lipo -archs "$app/Contents/MacOS/Nebula"
          arch -x86_64 "$app/Contents/MacOS/Nebula" --start-check 300 --data "$d/data" --settings "$d/settings" --crash-dumps "$d"
          sh platform/apple/check_module.sh "$app" "$d/module-check" "arch -x86_64"
      - name: The mod kit (a pre-release has none, a release has it)
        shell: bash
        run: |
          mode=--mods
          [ "$NEBULA_MODS" = OFF ] && mode=--no-mods
          for package in "$RUNNER_TEMP"/dist/*.zip; do
            python3 -X utf8 -I tools/check_mod_support_package.py "$package" $mode
          done
      # Kept in a dry run, and for a day in a release run: the Intel Mac's start check below takes it from here.
      - name: Keep it (dry run) and hand it to the Intel check
        uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: ${{ runner.temp }}/dist/*
          retention-days: ${{ needs.release.outputs.publish == 'true' && 1 || 90 }}
          if-no-files-found: error
      - name: Add it to the release
        if: needs.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/dist/* --repo "$GITHUB_REPOSITORY" --clobber

  # The Mac app's Intel half on an Intel Mac (GitHub's last Intel image): the universal app as packed, started to its first
  # pictures on Metal. The macos job above starts only its Apple silicon half (and the Intel half through Rosetta, told).
  macos-intel:
    name: Mac app on an Intel Mac
    needs: [release, macos]
    # The macos job itself ran (its own needs include the skipped lumakit job of a pre-release, which skips what follows it).
    if: ${{ !cancelled() && needs.macos.result == 'success' }}
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.ref }}
      - uses: actions/download-artifact@v8
        with:
          name: macos-universal
          path: ${{ runner.temp }}/dist
      - name: Start check (the app as unpacked, Metal, an Intel processor)
        timeout-minutes: 10
        env:
          PREFIX: ${{ needs.release.outputs.prefix }}
        run: |
          uname -m
          sysctl -n machdep.cpu.brand_string
          system_profiler SPDisplaysDataType | head -n 20 || true
          d="$RUNNER_TEMP/start"
          mkdir -p "$d/data" "$d/settings" "$d/unpacked"
          ditto -x -k "$RUNNER_TEMP/dist/$PREFIX-macOS.zip" "$d/unpacked"
          app=$(find "$d/unpacked" -maxdepth 3 -name Nebula.app -type d | head -n 1)
          [ -n "$app" ] || { echo "the zip has no Nebula.app"; exit 1; }
          lipo -archs "$app/Contents/MacOS/Nebula"
          "$app/Contents/MacOS/Nebula" --start-check 300 --data "$d/data" --settings "$d/settings" --crash-dumps "$d"
          # Its game module loads on this Intel processor (the first start of a player is this).
          sh platform/apple/check_module.sh "$app" "$d/module-check"

  # The release app is arm64 only and no runner starts it; its code is the test app's, which check.yml's emulator job
  # starts (--start-check through tools/lumacore/luma_test_android.py).
  android:
    name: Android app
    needs: [release, windows-hosts, lumakit]
    if: ${{ !cancelled() && needs.release.result == 'success' && needs.windows-hosts.result == 'success' && (needs.lumakit.result == 'success' || needs.lumakit.result == 'skipped') }}
    runs-on: windows-2022
    timeout-minutes: 300
    env:
      NEBULA_MODS: ${{ needs.release.outputs.mods }}
      NEBULA_VERSION_SUFFIX: ${{ needs.release.outputs.suffix }}
      NEBULA_REQUIRE_FSR3: 'ON'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.ref }}
      - name: Diagnostics address
        shell: bash
        env:
          NEBULA_DIAG_ENDPOINT: ${{ vars.NEBULA_DIAG_ENDPOINT }}
          NEBULA_DIAG_PUBLIC_KEY: ${{ vars.NEBULA_DIAG_PUBLIC_KEY }}
        run: bash tools/diag_endpoint_local.sh
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - name: Android NDK
        shell: pwsh
        run: |
          'y' | & "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat" --install "ndk;$env:ANDROID_NDK" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem "$env:ANDROID_HOME\ndk" | ForEach-Object Name
      - name: LLVM (the row generator's libclang)
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o llvm.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-$LLVM_VERSION/clang+llvm-$LLVM_VERSION-x86_64-pc-windows-msvc.tar.xz"
          mkdir llvm
          tar -xJf llvm.tar.xz -C llvm --strip-components=1
          rm llvm.tar.xz
          echo "LLVM_ROOT=$(cygpath -m "$RUNNER_TEMP/llvm")" >> "$GITHUB_ENV"
      - name: Dependencies
        shell: bash
        run: sh tools/fetch_build_deps.sh "$RUNNER_TEMP/deps" android
      - uses: actions/download-artifact@v8
        with:
          name: windows-hosts-avx2
          path: ${{ runner.temp }}/avx2
      - name: Build the app
        shell: pwsh
        run: |
          $temp = $env:RUNNER_TEMP
          if ($env:NEBULA_MODS -eq 'OFF') {
            # No mod support: no LumaKit (the script reads NEBULA_MODS).
            .\platform\android\build_apk.ps1 -Deps (Join-Path $temp 'deps') -Work (Join-Path $temp 'apk') `
              -HostTools (Join-Path $temp 'avx2\host-tools') -NoMods -Unsigned -ReleaseKey ''
          } else {
            $shipped = Join-Path $temp 'shipped'
            New-Item -ItemType Directory -Force $shipped | Out-Null
            Copy-Item installer\lumakit\lumakit.luma $shipped
            .\platform\android\build_apk.ps1 -Deps (Join-Path $temp 'deps') -Work (Join-Path $temp 'apk') `
              -HostTools (Join-Path $temp 'avx2\host-tools') -ShippedMods $shipped -Unsigned -ReleaseKey ''
          }
      - name: Name it
        shell: bash
        env:
          PREFIX: ${{ needs.release.outputs.prefix }}
        run: |
          mkdir -p "$RUNNER_TEMP/dist"
          # Signed on the release PC (installer/sign-release.ps1), which uploads it as <prefix>-Android.apk.
          cp "$RUNNER_TEMP/apk/Nebula-unsigned.apk" "$RUNNER_TEMP/dist/$PREFIX-Android-unsigned.apk"
      - name: FSR 3 (the app's program holds it)
        shell: bash
        run: python -X utf8 -I tools/check_fsr3_package.py "$RUNNER_TEMP"/dist/*.apk
      - name: The mod kit (a pre-release has none, a release has it)
        shell: bash
        run: |
          mode=--mods
          [ "$NEBULA_MODS" = OFF ] && mode=--no-mods
          for package in "$RUNNER_TEMP"/dist/*.apk; do
            python -X utf8 -I tools/check_mod_support_package.py "$package" $mode
          done
      - name: Keep it (dry run)
        if: needs.release.outputs.publish != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: android
          path: ${{ runner.temp }}/dist/*
          if-no-files-found: error
      - name: Add it to the release
        if: needs.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/dist/* --repo "$GITHUB_REPOSITORY" --clobber
