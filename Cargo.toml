[workspace]
members = ["crates/nebula-import"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
rust-version = "1.74"

[workspace.dependencies]
anyhow = "1.0"
sha1 = "0.10"
tempfile = "3.20"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO", "Win32_System_Ioctl"] }

# A package's importer and mods' cooker (cargo build --profile dist: Setup's and the Android app's build scripts): one
# code unit and inlining across crates for the disc reader, the decoders and the hashes. The everyday release build
# keeps cargo's defaults, so it stays quick. Panics still unwind: c_api.rs, jni.rs and the cooker catch them.
[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
