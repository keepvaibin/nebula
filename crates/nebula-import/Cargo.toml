[package]
name = "nebula-import"
description = "Imports a Super Mario Galaxy (RMGE01) disc image into the content folder the native game runs from."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# A build that takes extracted game folders only: no disc image is read.
folders-only = []
proof-tools = []

[dependencies]
luma-validate = { path = "../luma-validate" }
anyhow.workspace = true
jni-sys = "0.4"
nod = "=1.4.4"
encoding_rs = "0.8"
lewton = "0.10"
png = "0.17"
zune-jpeg = "0.5"
mikktspace = { version = "0.3", default-features = false, features = ["glam"] }
serde_json = "1"
sha1.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The validator's test zip writer (tests/validate_c.rs shares luma-validate's tests/common).
miniz_oxide = "0.8"
crc32fast = "1"
